name: Cruces predictivos de peatones
on:
  pull_request:
    branches: [main]
    paths:
      - 'game/src/characters/0149-pedestrian-crossing27.js'
      - 'tests/pedestrian-crossing-parallel.cjs'
      - '.github/workflows/npc-crossing-forecast.yml'
  push:
    branches: [main]
    paths:
      - 'game/src/characters/0149-pedestrian-crossing27.js'
      - 'tests/pedestrian-crossing-parallel.cjs'
      - '.github/workflows/npc-crossing-forecast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar seguridad predictiva y comportamiento perpendicular previo
        run: node tests/pedestrian-crossing-parallel.cjs
