name: Juego sin armas de fuego
on:
  pull_request:
    branches: [main]
    paths:
      - 'game/src/**'
      - 'tests/melee-only-no-firearms.cjs'
      - '.github/workflows/melee-only.yml'
  push:
    branches: [main]
    paths:
      - 'game/src/**'
      - 'tests/melee-only-no-firearms.cjs'
      - '.github/workflows/melee-only.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  equipment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/melee-only-no-firearms.cjs
