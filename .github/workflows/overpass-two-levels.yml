name: Paso a desnivel y circulación a dos alturas
on:
  pull_request:
    branches: [main]
    paths:
      - 'game/src/world/0050-ground-at.js'
      - 'game/src/world/0226-install-road33.js'
      - 'game/src/engine/0370-tick.js'
      - 'game/src/vehicles/0369-step-fleet13.js'
      - 'game/src/vehicles/0168-step-traffic29.js'
      - 'game/src/vehicles/0115-fleet-snapshot25.js'
      - 'game/src/vehicles/0116-step-traffic25.js'
      - 'game/src/core/0051-blocked.js'
      - 'game/src/core/0011-contact40.js'
      - 'game/src/vehicles/0012-vehicle-contact40.js'
      - 'tests/overpass-two-levels.cjs'
      - '.github/workflows/overpass-two-levels.yml'
  push:
    branches: [main]
    paths:
      - 'game/src/world/0050-ground-at.js'
      - 'game/src/world/0226-install-road33.js'
      - 'game/src/engine/0370-tick.js'
      - 'game/src/vehicles/0369-step-fleet13.js'
      - 'game/src/vehicles/0168-step-traffic29.js'
      - 'game/src/vehicles/0115-fleet-snapshot25.js'
      - 'game/src/vehicles/0116-step-traffic25.js'
      - 'game/src/core/0051-blocked.js'
      - 'game/src/core/0011-contact40.js'
      - 'game/src/vehicles/0012-vehicle-contact40.js'
      - 'tests/overpass-two-levels.cjs'
      - '.github/workflows/overpass-two-levels.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  niveles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/overpass-two-levels.cjs
      # La conducción completa se comprueba en modular-validation tras compilar el HTML.
