name: Física y conducción
on:
  push:
    branches: [perf/vehicle-handling]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: handling-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python3 scripts/build_performance.py
      - run: node --max-old-space-size=768 tests/vehicle-handling.cjs
      - run: npm install --no-save --package-lock=false playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - name: Probar conducción en el HTML completo
        run: node scripts/test_driving_browser.cjs
      - name: Conservar pruebas y capturas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Nagua-conduccion
          path: |
            dist/vehicle-handling.json
            dist/vehicle-handling-browser.json
            dist/handling-sedan.png
            dist/handling-pulsar.png
          retention-days: 14
