name: Diagnóstico arranque Android 56 por ciento
on:
  pull_request:
    branches: [main]
    paths:
      - 'game/src/core/0464-trystatement.js'
      - 'game/src/engine/0463-boot45.js'
      - 'tests/startup-mobile-56.cjs'
      - '.github/workflows/startup-mobile-56.yml'
  push:
    branches: [main]
    paths:
      - 'game/src/core/0464-trystatement.js'
      - 'game/src/engine/0463-boot45.js'
      - 'tests/startup-mobile-56.cjs'
      - '.github/workflows/startup-mobile-56.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar transiciones reales tras vehículos 24/24
        run: node tests/startup-mobile-56.cjs
