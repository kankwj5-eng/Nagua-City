name: Giros de peatones sin trigonometría repetida
on:
  pull_request:
    branches: [main]
    paths:
      - 'game/src/characters/0126-update-people25.js'
      - 'tests/pedestrian-turn-table.cjs'
      - '.github/workflows/pedestrian-turn-check.yml'
  push:
    branches: [main]
    paths:
      - 'game/src/characters/0126-update-people25.js'
      - 'tests/pedestrian-turn-table.cjs'
      - '.github/workflows/pedestrian-turn-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  steering:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Comparar 10 000 giros con los cálculos anteriores
        run: node tests/pedestrian-turn-table.cjs
