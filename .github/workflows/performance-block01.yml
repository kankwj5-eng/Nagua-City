name: Rendimiento por bloques
on:
  push:
    branches: [main, 'perf/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: perf-block01-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Construir el HTML sin modificar recursos visuales
        run: python3 scripts/build_performance.py
      - name: Comparar animaciones con el motor original
        run: node --max-old-space-size=512 tests/performance-block01.cjs
      - name: Verificar streaming, concurrencia y caché
        run: node --max-old-space-size=512 tests/performance-block02.cjs
      - name: Verificar almacenamiento exacto de animaciones
        run: node --max-old-space-size=512 tests/performance-block03.cjs
      - name: Verificar piezas y pausas de carga de vehículos
        run: node --max-old-space-size=512 tests/performance-block04.cjs
      - name: Verificar geometrías compartidas
        run: node --max-old-space-size=768 tests/performance-block05.cjs
      - name: Verificar residencia progresiva y recorridos repetidos
        run: node --max-old-space-size=768 tests/performance-block06.cjs
      - name: Conservar HTML y pruebas
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Managua-optimizado
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
