name: Construir base original V4
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/original-full-v4.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - run: git lfs pull
      - run: python3 scripts/build_modular.py
      - uses: actions/upload-artifact@v4
        with:
          name: nagua-base-original
          path: dist/Managua.html
          retention-days: 1
