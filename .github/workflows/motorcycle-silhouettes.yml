name: Cuatro carrocerías de motos
on:
  pull_request:
    branches: [main]
    paths:
      - 'game/src/vehicles/0440-bike46.js'
      - 'tests/motorcycle-four-families.cjs'
      - 'scripts/test_visual_stage1.cjs'
      - '.github/workflows/motorcycle-silhouettes.yml'
  push:
    branches: [main]
    paths:
      - 'game/src/vehicles/0440-bike46.js'
      - 'tests/motorcycle-four-families.cjs'
      - 'scripts/test_visual_stage1.cjs'
      - '.github/workflows/motorcycle-silhouettes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  styles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar familias, parámetros y pivotes de motos
        run: node tests/motorcycle-four-families.cjs
