name: Publicar Nagua City PWA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nagua-pwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Construir y verificar web instalable
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar proyecto con Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Asegurar que el HTML pesado fue descargado
        run: |
          git lfs pull
          test "$(wc -c < 'Managua_Del_taller_al_lago(1).html')" -gt 100000000
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencia para iconos PNG
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Ensamblar el juego desde módulos organizados (sin duplicar recursos)
        run: python3 scripts/build_modular.py --output dist/Managua-portable.html
      - name: Incorporar 16 GLB definitivos, eliminar 24 vehículos antiguos y sus LOD
        run: |
          python3 scripts/package_original_v4.py --source dist/Managua-portable.html --output dist/Managua-v4.html
          mv dist/Managua-v4.html dist/Managua-portable.html
      - name: Probar que el arranque no pide humanos antiguos eliminados
        run: python3 -m unittest discover -s tests -p 'test_v4_bootstrap.py' -v
      - name: Preparar portada, manifiesto, iconos y service worker
        run: python3 scripts/build_pwa.py --game dist/Managua-portable.html --output dist/site
      - name: Validar que la PWA dividió sus recursos sin modificar el archivo portátil
        run: |
          python3 -m unittest discover -s tests -p 'test_fast_web.py' -v
          python3 - <<'PY'
          from pathlib import Path
          portable=Path('dist/Managua-portable.html')
          web=Path('dist/site/Managua.html')
          resources=list(Path('dist/site/assets/stream').iterdir())
          print({'portableBytes': portable.stat().st_size,'webStartBytes': web.stat().st_size,'streamChunks':len(resources)})
          assert portable.stat().st_size > 100000000
          assert web.stat().st_size < portable.stat().st_size * .85
          assert len(resources)>100
          PY
      - name: Verificar que la web usa los módulos JavaScript verdaderos
        run: node tests/module-source.cjs dist/site/Managua.html
      - name: Probar instalación y archivos PWA
        run: python3 -m unittest discover -s tests -p 'test_pwa.py' -v
      - name: Verificar guía interactiva y navegación accesible
        run: node tests/pwa-launcher-interaction.cjs
      - name: Validar JavaScript del lanzador
        run: |
          node --check web/app.js
          node --check web/sw.js
      - name: Preparar Chromium para la prueba web con archivos externos
        run: |
          npm install --no-save --package-lock=false playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Auditar portada real en Chromium y comprobar enlace público
        run: node scripts/audit_site_browser.cjs
      - name: Adjuntar capturas e informe de la página web
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nagua-auditoria-web-chromium
          path: dist/site-audit/
          if-no-files-found: warn
          retention-days: 14
      - name: Entrar al juego PWA sobre HTTP y comprobar descargas progresivas
        run: node scripts/test_fast_web_browser.cjs
      - name: Adjuntar informe de arranque web
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nagua-arranque-web
          path: |
            dist/fast-web-browser.json
            dist/v4-browser-ciudad.png
          if-no-files-found: warn
          retention-days: 14
      - name: Configurar Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Subir sitio estático a Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    name: Publicar aplicación web
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Desplegar PWA
        id: deployment
        uses: actions/deploy-pages@v4
