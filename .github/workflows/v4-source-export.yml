name: Exportar fuente original para integración V4
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/v4-source-export.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - name: Empaquetar fuentes sin binarios
        run: |
          mkdir -p dist/v4-source
          tar -czf dist/v4-source/nagua-original-source.tar.gz game/src game/manifest.json performance scripts web tests .gitattributes 2>/dev/null
          wc -c dist/v4-source/nagua-original-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: nagua-original-source-v4
          path: dist/v4-source/nagua-original-source.tar.gz
          retention-days: 2
