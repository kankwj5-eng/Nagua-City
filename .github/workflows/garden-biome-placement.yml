name: Jardines tropicales por barrio
on:
  pull_request:
    branches: [main]
    paths:
      - 'game/src/world/0442-gardens46.js'
      - 'tests/garden-biome-placement.cjs'
      - '.github/workflows/garden-biome-placement.yml'
  push:
    branches: [main]
    paths:
      - 'game/src/world/0442-gardens46.js'
      - 'tests/garden-biome-placement.cjs'
      - '.github/workflows/garden-biome-placement.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar cinco especies y presupuesto de ubicaciones
        run: node tests/garden-biome-placement.cjs
