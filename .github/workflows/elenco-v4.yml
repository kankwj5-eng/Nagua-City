name: Validar preparación del elenco Nicaragua v4
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/import_cast_v4.py'
      - 'scripts/import_vehicles_v4.py'
      - 'game/vehicles-v4/**'
      - 'tests/vehicle-v4-runtime.cjs'
      - 'tests/test_import_vehicles_v4.py'
      - 'scripts/audit_cast_v4.py'
      - 'tests/test_audit_cast_v4.py'
      - 'tests/test_cast_v4.py'
      - 'docs/ELENCO_NICARAGUA_V4.md'
      - 'game/characters-v4/**'
      - 'game/v4/**'
      - 'tests/v4-zip-loader.cjs'
      - 'tests/cast-v4-runtime.cjs'
      - '.github/workflows/elenco-v4.yml'
  push:
    branches: [main]
    paths:
      - 'game/characters-v4/**'
      - 'tests/cast-v4-runtime.cjs'
      - 'scripts/import_cast_v4.py'
      - 'tests/test_cast_v4.py'
      - 'docs/ELENCO_NICARAGUA_V4.md'
      - '.github/workflows/elenco-v4.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_cast_v4.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_audit_cast_v4.py' -v
      - name: Contar dependencias del elenco anterior sin silenciarlas
        run: python3 scripts/audit_cast_v4.py | python3 -c 'import json,sys; d=json.load(sys.stdin); print({k:v for k,v in d.items() if k != "detalles"})'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check game/characters-v4/cast-runtime.js
      - run: node tests/cast-v4-runtime.cjs
      - run: node tests/vehicle-v4-runtime.cjs
      - run: node tests/v4-zip-loader.cjs
      - run: node tests/v4-city-bridge.cjs
      - run: python3 -m unittest discover -s tests -p 'test_import_vehicles_v4.py' -v
