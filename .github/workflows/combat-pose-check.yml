name: Comprobar poses de combate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combat:
    name: Rotación y cache de articulaciones
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar huesos, posturas y recuperación del rig
        run: node tests/combat-pose-cache.cjs
